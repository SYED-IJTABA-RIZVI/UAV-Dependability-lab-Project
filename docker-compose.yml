services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uav}
      POSTGRES_DB: ${POSTGRES_DB:-uav}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uav} -d ${POSTGRES_DB:-uav}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uav}:${POSTGRES_PASSWORD:-uav}@postgres:5432/${POSTGRES_DB:-uav}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      YOLO_SERVICE_URL: http://yolo:8000
      YOLO_RGB_CHECKPOINT_PATH: /weights/yolov12_rgb.pt
      YOLO_IR_CHECKPOINT_PATH: /weights/yolov10_ir.pt
      VLM_SERVICE_URL: http://vlm:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./data:/data

  yolo:
    profiles: ["gpu"]
    build:
      context: ./app/yolo_server
    restart: unless-stopped
    runtime: nvidia
    environment:
      YOLO_RGB_CHECKPOINT_PATH: /weights/yolov12_rgb.pt
      YOLO_IR_CHECKPOINT_PATH: /weights/yolov10_ir.pt
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./weights:/weights

  vlm:
    profiles: ["gpu"]
    build:
      context: ./app/vlm_server
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  pgdata:
  hf_cache:

