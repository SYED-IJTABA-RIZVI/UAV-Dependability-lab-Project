services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uav}
      POSTGRES_DB: ${POSTGRES_DB:-uav}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uav} -d ${POSTGRES_DB:-uav}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uav}:${POSTGRES_PASSWORD:-uav}@postgres:5432/${POSTGRES_DB:-uav}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RFDETR_SERVICE_URL: http://rfdetr:8000
      RFDETR_RGB_CHECKPOINT_PATH: /weights/rfdetr_rgb.pt
      RFDETR_IR_CHECKPOINT_PATH: /weights/rfdetr_ir.pt
      VLM_INTERNVL3_URL: http://vlm-internvl3:8000
      VLM_DEEPSEEK_VL_URL: http://vlm-deepseek-vl:8000
      VLM_BLIP2_URL: http://vlm-blip2:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./data:/data

  rfdetr:
    profiles: ["gpu"]
    build:
      context: ./app/rfdetr_server
    restart: unless-stopped
    runtime: nvidia
    environment:
      RFDETR_RGB_CHECKPOINT_PATH: /weights/rfdetr_rgb.pt
      RFDETR_IR_CHECKPOINT_PATH: /weights/rfdetr_ir.pt
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./weights:/weights

  rfdetr-debug:
    profiles: ["debug"]
    build:
      context: ./app/rfdetr_server
    runtime: nvidia
    environment:
      RFDETR_RGB_CHECKPOINT_PATH: /weights/rfdetr_rgb.pt
      RFDETR_IR_CHECKPOINT_PATH: /weights/rfdetr_ir.pt
      MODALITY: ${DEBUG_MODALITY:-RGB}
      RFDETR_THRESHOLD: ${DEBUG_THRESHOLD:-0.3}
      TEST_FOLDER: /test_data
      OUTPUT_CSV: /output/debug_predictions.csv
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./weights:/weights
      - ./debug_test_data:/test_data
      - ./debug_output:/output
    command: ["python", "debug_predict.py"]

  vlm-internvl3:
    profiles: ["gpu"]
    build:
      context: ./app/vlm_server
    restart: unless-stopped
    runtime: nvidia
    environment:
      MODEL_ID: OpenGVLab/InternVL3-8B
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf_cache:/root/.cache/huggingface

  vlm-deepseek-vl:
    profiles: ["gpu"]
    build:
      context: ./app/vlm_server
    restart: unless-stopped
    runtime: nvidia
    environment:
      MODEL_ID: deepseek-ai/deepseek-vl2-tiny
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf_cache:/root/.cache/huggingface

  vlm-blip2:
    profiles: ["gpu"]
    build:
      context: ./app/vlm_server
    restart: unless-stopped
    runtime: nvidia
    environment:
      MODEL_ID: Salesforce/blip2-opt-2.7b
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  pgdata:
  hf_cache:

