services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uav}
      POSTGRES_DB: ${POSTGRES_DB:-uav}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uav} -d ${POSTGRES_DB:-uav}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
